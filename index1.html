<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - AR Worm</title>

  <!-- Open-source libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 420px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 90vw;
      max-width: 380px;
      padding: 0;
    }

    button {
      flex: 1;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #slow-button { background: #4caf50; color: #ffffff; }
    #fast-button { background: #ff9800; color: #ffffff; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.85;
    }
  </style>

  <script>
    // Component สำหรับควบคุมการเคลื่อนไหวของหนอน (เลื้อยไปมา)
    AFRAME.registerComponent('worm-move', {
      schema: {
        speed: { type: 'number', default: 1.5 }
      },
      tick: function (time, delta) {
        if (!delta) return;
        const t = (time / 1000) * this.data.speed;
        // เคลื่อนที่ซ้าย-ขวา และขยับความสูงเล็กน้อยจำลองการเลื้อย
        const x = Math.sin(t) * 0.25;
        const yOffset = Math.abs(Math.cos(t * 2)) * 0.05;
        
        this.el.object3D.position.x = x;
        this.el.object3D.position.y = 0.1 + yOffset;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const worm = document.querySelector('#worm');
      const topPanel = document.querySelector('#top-panel');
      const slowButton = document.querySelector('#slow-button');
      const fastButton = document.querySelector('#fast-button');
      const arLabel = document.querySelector('#ar-label');

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — เจ้าหนอนพร้อมเลื้อย<span class="hint">กดปุ่มด้านล่างเพื่อปรับความเร็วในการเคลื่อนไหว</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนพื้นผิวที่มีแสงสว่างเพียงพอ</span>';
      });

      slowButton.addEventListener('click', () => {
        worm.setAttribute('worm-move', 'speed', 1.0);
        arLabel.setAttribute('value', 'AR WORM\nSTATUS: SLOW');
        slowButton.style.boxShadow = '0 0 0 3px #fff';
        fastButton.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.3)';
      });

      fastButton.addEventListener('click', () => {
        worm.setAttribute('worm-move', 'speed', 4.5);
        arLabel.setAttribute('value', 'AR WORM\nSTATUS: FAST');
        fastButton.style.boxShadow = '0 0 0 3px #fff';
        slowButton.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.3)';
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเพื่อเริ่มใช้งาน AR</span>
  </div>

  <div id="controls">
    <button id="slow-button" type="button">🐌 เคลื่อนไหวช้า</button>
    <button id="fast-button" type="button">⚡ เคลื่อนไหวเร็ว</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- ฐานรองรับโมเดลหนอน -->
      <a-box
        position="0 0.02 0"
        width="1.2"
        height="0.04"
        depth="0.8"
        color="#37474f"
        roughness="0.7"
      ></a-box>

      <!-- กลุ่มโมเดลหนอน (Caterpillar / Worm) -->
      <a-entity id="worm" position="0 0.1 0" worm-move="speed: 1.5">
        <!-- ส่วนหัว (Head) พร้อมตา -->
        <a-sphere position="0.35 0.12 0" radius="0.14" color="#4caf50" roughness="0.4">
          <a-sphere position="0.08 0.06 0.08" radius="0.03" color="#ffffff">
            <a-sphere position="0.02 0 0.015" radius="0.015" color="#000000"></a-sphere>
          </a-sphere>
          <a-sphere position="0.08 0.06 -0.08" radius="0.03" color="#ffffff">
            <a-sphere position="0.02 0 -0.015" radius="0.015" color="#000000"></a-sphere>
          </a-sphere>
        </a-sphere>

        <!-- ลําตัวปล้องที่ 1 -->
        <a-sphere position="0.18 0.10 0" radius="0.13" color="#8bc34a" roughness="0.4"></a-sphere>

        <!-- ลําตัวปล้องที่ 2 -->
        <a-sphere position="0.02 0.09 0" radius="0.13" color="#cddc39" roughness="0.4"></a-sphere>

        <!-- ลําตัวปล้องที่ 3 -->
        <a-sphere position="-0.14 0.09 0" radius="0.12" color="#8bc34a" roughness="0.4"></a-sphere>

        <!-- ลําตัวปล้องที่ 4 -->
        <a-sphere position="-0.30 0.09 0" radius="0.11" color="#cddc39" roughness="0.4"></a-sphere>

        <!-- ส่วนหาง -->
        <a-sphere position="-0.44 0.08 0" radius="0.09" color="#4caf50" roughness="0.4"></a-sphere>
      </a-entity>

      <!-- ป้ายแสดงสถานะ AR -->
      <a-text
        id="ar-label"
        value="AR WORM\nSTATUS: NORMAL"
        position="0 0.75 0"
        rotation="-90 0 0"
        align="center"
        width="2.2"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
