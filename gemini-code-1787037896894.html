<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Birds Lab</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
    #top-panel { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(92vw, 520px); padding: 10px; border-radius: 12px; background: rgba(0,0,0,0.7); color: white; text-align: center; }
    #controls { position: fixed; bottom: 18px; width: 100%; display: flex; justify-content: center; gap: 10px; }
    button { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    #fly-faster { background: #4caf50; color: white; }
    #fly-normal { background: #2196f3; color: white; }
  </style>

  <script>
    // Component สำหรับจัดการการบิน
    AFRAME.registerComponent('bird-flight', {
      schema: { speed: { type: 'number', default: 3000 } },
      init: function () {
        this.updateAnimation();
      },
      update: function () {
        this.updateAnimation();
      },
      updateAnimation: function () {
        this.el.setAttribute('animation', {
          property: 'position',
          to: '0 2 0', // เคลื่อนที่ไปจุดนี้
          dir: 'alternate',
          dur: this.data.speed,
          loop: true,
          easing: 'easeInOutQuad'
        });
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const birds = [document.querySelector('#bird1'), document.querySelector('#bird2'), document.querySelector('#bird3')];
      
      document.querySelector('#fly-faster').addEventListener('click', () => {
        birds.forEach(b => b.setAttribute('bird-flight', 'speed', 800)); // เร็วขึ้น
      });

      document.querySelector('#fly-normal').addEventListener('click', () => {
        birds.forEach(b => b.setAttribute('bird-flight', 'speed', 3000)); // ช้าลง (ปกติ)
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">เล็งกล้องไปที่ Hiro Marker เพื่อดูนกบิน</div>
  
  <div id="controls">
    <button id="fly-faster">บินเร็วขึ้น!</button>
    <button id="fly-normal">บินช้า (ปกติ)</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam;">
    <a-marker preset="hiro">
      
      <!-- นกตัวที่ 1 -->
      <a-entity id="bird1" position="-0.5 0.5 0" bird-flight="speed: 3000">
        <a-cone color="yellow" radius-bottom="0.1" height="0.3" rotation="0 0 90"></a-cone>
      </a-entity>

      <!-- นกตัวที่ 2 -->
      <a-entity id="bird2" position="0 0.8 0" bird-flight="speed: 3500">
        <a-cone color="orange" radius-bottom="0.1" height="0.3" rotation="0 0 90"></a-cone>
      </a-entity>

      <!-- นกตัวที่ 3 -->
      <a-entity id="bird3" position="0.5 0.5 0" bird-flight="speed: 2500">
        <a-cone color="red" radius-bottom="0.1" height="0.3" rotation="0 0 90"></a-cone>
      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
